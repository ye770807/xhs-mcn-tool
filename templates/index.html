<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书MCN博主邀约工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: #ff2442;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #1d1d1f;
        }
        
        .version {
            font-size: 14px;
            color: #86868b;
        }
        
        /* 卡片 */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #1d1d1f;
        }
        
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #ff2442;
            border-radius: 2px;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            background: #86868b;
            min-height: 24px;
            display: flex;
            align-items: center;
        }
        
        .status-badge.success { background: #28a745; }
        .status-badge.error { background: #ff2442; }
        .status-badge.processing { background: #007bff; }
        
        /* 表单 */
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 15px;
            background: #fbfbfd;
            transition: all 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #ff2442;
            background: white;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: #ff2442;
            color: white;
        }
        
        .btn-primary:hover {
            background: #e0203c;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-info {
            background: #007bff;
            color: white;
        }
        
        .btn-info:hover {
            background: #0056b3;
        }
        
        /* 结果区域 */
        .result-box {
            background: #fbfbfd;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 100px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            color: #86868b;
            font-size: 14px;
        }
        
        .result-value {
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* UID列表 */
        .uid-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
            background: #fbfbfd;
            resize: vertical;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        /* 使用说明 */
        .help-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .help-title {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 10px;
        }
        
        .help-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
        }
        
        .help-number {
            width: 20px;
            height: 20px;
            background: #ff2442;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        /* 底部按钮 */
        .bottom-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn-attach {
            padding: 15px 50px;
            font-size: 16px;
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .title {
                font-size: 18px;
            }
            
            .input-row {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .card {
                padding: 15px;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo-section">
                <div class="logo">🍠</div>
                <div class="title">小红书MCN博主邀约工具</div>
            </div>
            <div class="version">专业版 v2.0</div>
        </div>
        
        <!-- 博主信息查询 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">博主信息查询</div>
                <div class="status-badge" id="queryStatus"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">博主ID</label>
                <div class="input-row">
                    <input type="text" id="userId" placeholder="请输入博主ID">
                    <button class="btn btn-primary" id="queryBtn" onclick="queryUser()">获取</button>
                </div>
            </div>
            
            <div class="result-box" id="resultBox" style="display: none;">
                <div class="result-item">
                    <span class="result-label">博主ID</span>
                    <span class="result-value" id="resultUserId">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">昵称</span>
                    <span class="result-value" id="resultNickname">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">粉丝数量</span>
                    <span class="result-value" id="resultFans">-</span>
                </div>
            </div>
            
            <div class="help-section">
                <div class="help-title">使用说明</div>
                <div class="help-item">
                    <div class="help-number">1</div>
                    <div>填写博主ID、姓名、电话等信息</div>
                </div>
                <div class="help-item">
                    <div class="help-number">2</div>
                    <div>点击「获取」按钮获取博主信息</div>
                </div>
                <div class="help-item">
                    <div class="help-number">3</div>
                    <div>设置挂靠时间后点击「挂靠」按钮</div>
                </div>
            </div>
        </div>
        
        <!-- UID列表 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">UID列表</div>
            </div>
            <textarea class="uid-textarea" id="uidList" placeholder="查询到的博主UID将显示在这里..."></textarea>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="clearUidList()">清空列表</button>
                <button class="btn btn-success" onclick="copyUidList()">复制全部</button>
                <button class="btn btn-info" onclick="openSheet()">结账工作表</button>
            </div>
        </div>
        
        <!-- 挂靠信息 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">挂靠信息</div>
                <div class="status-badge" id="attachStatus"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" id="name" placeholder="请输入姓名">
            </div>
            
            <div class="form-group">
                <label class="form-label">电话</label>
                <div class="input-row">
                    <select id="areaCode" style="flex: 0 0 100px;">
                        <option value="+86">+86</option>
                        <option value="+852">+852</option>
                        <option value="+853">+853</option>
                        <option value="+886">+886</option>
                    </select>
                    <input type="tel" id="phone" placeholder="请输入电话号码">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">挂靠时间</label>
                <div class="input-row">
                    <input type="date" id="startDate">
                    <span style="padding: 12px 0;">至</span>
                    <input type="date" id="endDate">
                </div>
            </div>
        </div>
        
        <!-- 底部操作 -->
        <div class="bottom-actions">
            <button class="btn btn-primary btn-attach" id="attachBtn" onclick="attachUser()">确认挂靠</button>
        </div>
    </div>

    <script>
        // 当前查询到的用户ID
        let currentUserId = null;
        
        // 设置默认日期
        document.getElementById('startDate').valueAsDate = new Date();
        document.getElementById('endDate').valueAsDate = new Date(2028, 4, 15);
        
        // 设置查询状态
        function setQueryStatus(text, type) {
            const statusEl = document.getElementById('queryStatus');
            statusEl.textContent = text;
            statusEl.className = 'status-badge' + (type ? ' ' + type : '');
        }
        
        // 设置挂靠状态
        function setAttachStatus(text, type) {
            const statusEl = document.getElementById('attachStatus');
            statusEl.textContent = text;
            statusEl.className = 'status-badge' + (type ? ' ' + type : '');
        }
        
        // 查询博主
        async function queryUser() {
            const userId = document.getElementById('userId').value.trim();
            
            if (!userId) {
                setQueryStatus('请输入博主ID', 'error');
                return;
            }
            
            const btn = document.getElementById('queryBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>查询中...';
            setQueryStatus('查询中...', 'processing');
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentUserId = result.data.user_id;
                    
                    // 显示结果
                    document.getElementById('resultUserId').textContent = result.data.user_id;
                    document.getElementById('resultNickname').textContent = result.data.nickname;
                    document.getElementById('resultFans').textContent = result.data.fans_count.toLocaleString();
                    document.getElementById('resultBox').style.display = 'block';
                    
                    // 添加到UID列表
                    addUidToList(result.data.user_id);
                    
                    setQueryStatus('查询成功', 'success');
                } else {
                    setQueryStatus(result.message, 'error');
                    document.getElementById('resultBox').style.display = 'none';
                }
            } catch (error) {
                setQueryStatus('查询失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '获取';
            }
        }
        
        // 添加UID到列表
        function addUidToList(uid) {
            const textarea = document.getElementById('uidList');
            const currentText = textarea.value.trim();
            if (currentText) {
                textarea.value = currentText + '\n' + uid;
            } else {
                textarea.value = uid;
            }
        }
        
        // 清空UID列表
        function clearUidList() {
            document.getElementById('uidList').value = '';
            setQueryStatus('已清空', '');
        }
        
        // 复制UID列表
        function copyUidList() {
            const textarea = document.getElementById('uidList');
            if (textarea.value.trim()) {
                textarea.select();
                document.execCommand('copy');
                setQueryStatus('已复制到剪贴板', 'success');
            } else {
                setQueryStatus('UID列表为空', 'error');
            }
        }
        
        // 打开结账工作表
        function openSheet() {
            window.open('https://www.kdocs.cn/l/cn7wDjdk4tBj', '_blank');
            setQueryStatus('已打开结账工作表', 'success');
        }
        
        // 挂靠博主
        async function attachUser() {
            if (!currentUserId) {
                setAttachStatus('请先查询博主信息', 'error');
                return;
            }
            
            const name = document.getElementById('name').value.trim();
            const areaCode = document.getElementById('areaCode').value;
            const phone = document.getElementById('phone').value.trim();
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!name) {
                setAttachStatus('请输入姓名', 'error');
                return;
            }
            
            if (!phone) {
                setAttachStatus('请输入电话号码', 'error');
                return;
            }
            
            const btn = document.getElementById('attachBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>挂靠中...';
            setAttachStatus('挂靠中...', 'processing');
            
            try {
                const response = await fetch('/api/attach', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUserId,
                        name: name,
                        area_code: areaCode,
                        phone_number: phone,
                        start_date: startDate,
                        end_date: endDate
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    setAttachStatus('挂靠成功', 'success');
                } else {
                    setAttachStatus(result.message, 'error');
                }
            } catch (error) {
                setAttachStatus('挂靠失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '确认挂靠';
            }
        }
        
        // 回车键查询
        document.getElementById('userId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryUser();
            }
        });
    </script>
</body>
</html>
